name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore DemoApps/DemoApps.csproj

      - name: Build
        run: dotnet build DemoApps/DemoApps.csproj -c Release

      - name: Publish
        run: dotnet publish DemoApps/DemoApps.csproj -c Release -o /var/www/DemoApps