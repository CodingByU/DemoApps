name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          pwd
          find . -type f \( -name "*.csproj" -o -name "*.sln" -o -name "*.slnx" \)

      - name: Restore
        run: dotnet restore DemoApps.slnx

      - name: Build
        run: dotnet build DemoApps.slnx -c Release

      - name: Publish
        run: dotnet publish DemoApps.slnx -c Release -o /var/www/DemoApps